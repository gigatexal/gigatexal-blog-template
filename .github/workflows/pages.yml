name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Preflight: read the `pages_deploy`, `image_host` and `cdn_purge` flags from
  # _config.yml. Build/deploy only run when `pages_deploy` is true; the image
  # steps only run when `image_host` is not `local`; the CDN purge only runs when
  # `cdn_purge` is true.
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      image_host: ${{ steps.check.outputs.image_host }}
      cdn_purge: ${{ steps.check.outputs.cdn_purge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read deploy flags
        id: check
        run: |
          if grep -qE '^pages_deploy:[[:space:]]*true' _config.yml; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^image_host:[[:space:]]*s3' _config.yml; then
            echo "image_host=s3" >> "$GITHUB_OUTPUT"
          else
            echo "image_host=local" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^cdn_purge:[[:space:]]*true' _config.yml; then
            echo "cdn_purge=true" >> "$GITHUB_OUTPUT"
          else
            echo "cdn_purge=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: needs.check.outputs.image_host != 'local'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image script deps
        if: needs.check.outputs.image_host != 'local'
        run: pip install -r scripts/requirements.txt

      - name: Upload images to object storage
        if: needs.check.outputs.image_host != 'local'
        run: python3 scripts/images.py upload
        env:
          IMAGES_BUCKET: ${{ secrets.IMAGES_BUCKET }}
          IMAGES_ACCESS_KEY_ID: ${{ secrets.IMAGES_ACCESS_KEY_ID }}
          IMAGES_SECRET_ACCESS_KEY: ${{ secrets.IMAGES_SECRET_ACCESS_KEY }}
          IMAGES_ENDPOINT_URL: ${{ secrets.IMAGES_ENDPOINT_URL }}
          IMAGES_REGION: ${{ secrets.IMAGES_REGION }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Rewrite image URLs to object storage
        if: needs.check.outputs.image_host != 'local'
        run: python3 scripts/images.py rewrite
        env:
          IMAGES_PUBLIC_URL: ${{ secrets.IMAGES_PUBLIC_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: [check, build]
    if: needs.check.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Optional CDN cache purge, off unless `cdn_purge: true` in _config.yml.
      # Cloudflare example: purge the whole zone so a fresh deploy is visible
      # immediately. Configure the CF_ZONE_ID and CF_API_TOKEN repository secrets
      # (the token only needs cache-purge permission). Using another CDN? Replace
      # the run block with your provider's API call, or delete this step.
      - name: Purge CDN cache
        if: needs.check.outputs.cdn_purge == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          resp=$(curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}')
          echo "$resp"
          echo "$resp" | jq -e '.success == true' >/dev/null
