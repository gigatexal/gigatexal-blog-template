title: My Blog
tagline: A Jekyll blog with tags and a clean reading theme
description: A minimal Jekyll blog with tag filtering, RSS, a sitemap, and a clean reading theme. Fork it, change the title, and start writing.
url: "https://example.com"
# Leave baseurl empty for a user site (username.github.io). For a project site
# (username.github.io/repo), the included GitHub Actions workflow sets it for you;
# if you build manually, set it to "/repo" instead.
baseurl: ""

# GitHub Pages deploy switch. Set to `true` to activate the Actions workflow
# (.github/workflows/pages.yml) that builds and publishes the site on every
# push to `main`. Leave `false` while using this repo as a plain template.
pages_deploy: false

# Where post images are hosted. `local` (default) serves images from the repo
# via GitHub Pages. Set to `s3` to offload posts marked `upload_images: true`
# to any S3-compatible store (AWS S3, Cloudflare R2, MinIO, Backblaze B2) —
# see the README ("Hosting images") for the required repository secrets.
# Use the plain value `local` or `s3` (no quotes).
image_host: local


author:
  name: Your Name

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
